<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Gold conic gradient ring simulated with a sweep -->
    <linearGradient id="gold-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="33%" stop-color="#F0D060"/>
      <stop offset="66%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <!-- Gold gradient for the N letter -->
    <linearGradient id="gold-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <!-- Outer glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Gold ring glow layer -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#gold-ring)" stroke-width="5" opacity="0.5" filter="url(#glow)"/>
  <!-- Gold ring -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#gold-ring)" stroke-width="4.5"/>
  <!-- Dark inner circle -->
  <circle cx="64" cy="64" r="56" fill="#0B0E14"/>
  <circle cx="64" cy="64" r="56" fill="url(#gold-ring)" opacity="0.03"/>
  <!-- N letter in gold -->
  <text x="64" y="84" text-anchor="middle" font-family="monospace, 'Courier New', monospace" font-size="68" font-weight="bold" fill="url(#gold-text)">N</text>
</svg>
